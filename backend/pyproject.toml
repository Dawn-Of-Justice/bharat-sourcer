[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bharat-sourcer-backend"
version = "0.27.0"
description = "Bharat Sourcer API and analysis workflow"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11,<13",
    "google-auth[requests]>=2.40,<3",
    "google-cloud-firestore>=2.20,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6.19,<7",
    "weasyprint>=66,<70",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bharat_sourcer.sourcing" = ["*.json"]
bharat_sourcer = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
