name: Frontend

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:server
      # Runs the real preview/auth/API modules with network access forbidden; no backend needed.
      - run: npm run test:preview

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: frontend-cloud-run-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: hackathon-510415
      REGION: asia-south1
      SERVICE: bharat-sourcer-web
      IMAGE: asia-south1-docker.pkg.dev/hackathon-510415/cloud-run-source-deploy/bharat-sourcer-web
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/689415686498/locations/global/workloadIdentityPools/bharat-github/providers/backend
          service_account: bharat-sourcer-deploy@hackathon-510415.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure image registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - name: Build and push tested commit
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" frontend
          docker push "$IMAGE:$GITHUB_SHA"
      # Runtime config (backend URL, integration key, Firebase web config) stays on the service.
      - name: Deploy image to Cloud Run
        run: |
          gcloud run services update "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" --quiet
      - name: Verify deployed revision
        run: |
          deployed_image=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" \
            --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          test "$deployed_image" = "$IMAGE:$GITHUB_SHA"
          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" \
            --region "$REGION" --format='value(status.url)')
          curl -fsS -o /dev/null "$url/"
