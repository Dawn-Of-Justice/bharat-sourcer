name: Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # Pango for WeasyPrint (PDF export tests).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python scripts/export_openapi.py --check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: backend-cloud-run-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: hackathon-510415
      REGION: asia-south1
      SERVICE: bharat-sourcer-integration
      IMAGE: asia-south1-docker.pkg.dev/hackathon-510415/cloud-run-source-deploy/bharat-sourcer-integration
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/689415686498/locations/global/workloadIdentityPools/bharat-github/providers/backend
          service_account: bharat-sourcer-deploy@hackathon-510415.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure image registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - name: Build and push tested commit
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" backend
          docker push "$IMAGE:$GITHUB_SHA"
      # Only the image changes; env vars, pinned secrets, runtime identity, scaling and
      # Cloud Tasks settings stay as configured by scripts/deploy_integration.py.
      - name: Deploy image to Cloud Run
        run: |
          gcloud run services update "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" --quiet
      - name: Verify deployed revision and API version
        run: |
          deployed_image=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" \
            --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          test "$deployed_image" = "$IMAGE:$GITHUB_SHA"
          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" \
            --region "$REGION" --format='value(status.url)')
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          actual=$(curl -fsS "$url/openapi.json" | python3 -c "import json, sys; print(json.load(sys.stdin)['info']['version'])")
          echo "Deployed $actual at $url"
          test "$actual" = "$expected"

  # Compile runner images (code-adapt tier 3), rebuilt only when backend/compile changes.
  # Jobs, network and identities are provisioned by scripts/setup_compile_runner.py.
  compile-images:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [avr, esp32, esp8266, rp2040]
    concurrency:
      group: compile-image-${{ matrix.family }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: hackathon-510415
      REGION: asia-south1
      JOB: bharat-sourcer-compile-${{ matrix.family }}
      IMAGE: asia-south1-docker.pkg.dev/hackathon-510415/bharat-sourcer-compile/runner-${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for runner changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
            && git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- backend/compile; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.build == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/689415686498/locations/global/workloadIdentityPools/bharat-github/providers/backend
          service_account: bharat-sourcer-deploy@hackathon-510415.iam.gserviceaccount.com
      - if: steps.changed.outputs.build == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Build, push and update the job image
        if: steps.changed.outputs.build == 'true'
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build --build-arg FAMILY=${{ matrix.family }} --tag "$IMAGE:$GITHUB_SHA" backend/compile
          docker push "$IMAGE:$GITHUB_SHA"
          gcloud run jobs update "$JOB" --project "$GCP_PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" --quiet
