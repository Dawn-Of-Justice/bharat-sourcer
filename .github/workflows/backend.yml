name: Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python scripts/export_openapi.py --check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: backend-cloud-run-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: hackathon-510415
      REGION: asia-south1
      SERVICE: bharat-sourcer-integration
      IMAGE: asia-south1-docker.pkg.dev/hackathon-510415/cloud-run-source-deploy/bharat-sourcer-integration
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/689415686498/locations/global/workloadIdentityPools/bharat-github/providers/backend
          service_account: bharat-sourcer-deploy@hackathon-510415.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure image registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - name: Build and push tested commit
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" backend
          docker push "$IMAGE:$GITHUB_SHA"
      # Only the image changes; env vars, pinned secrets, runtime identity, scaling and
      # Cloud Tasks settings stay as configured by scripts/deploy_integration.py.
      - name: Deploy image to Cloud Run
        run: |
          gcloud run services update "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" --quiet
      - name: Verify deployed revision and API version
        run: |
          deployed_image=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" \
            --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          test "$deployed_image" = "$IMAGE:$GITHUB_SHA"
          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" \
            --region "$REGION" --format='value(status.url)')
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          actual=$(curl -fsS "$url/openapi.json" | python3 -c "import json, sys; print(json.load(sys.stdin)['info']['version'])")
          echo "Deployed $actual at $url"
          test "$actual" = "$expected"
