name: Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/contracts/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python scripts/export_openapi.py --check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: backend-cloud-run-integration
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: hackathon-510415
      GCP_REGION: asia-south1
      SERVICE: bharat-sourcer-integration
      IMAGE: asia-south1-docker.pkg.dev/hackathon-510415/cloud-run-source-deploy/bharat-sourcer-integration
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/689415686498/locations/global/workloadIdentityPools/bharat-github/providers/backend
          service_account: bharat-sourcer-deploy@hackathon-510415.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure image registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - name: Build and push tested commit
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" backend
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy image preserving runtime secrets and queue configuration
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --format='value(image_summary.digest)')
          test -n "$digest"
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --image="$IMAGE@$digest" \
            --min=0 --min-instances=0 --max=1 --max-instances=1 \
            --cpu-throttling --timeout=1800 --quiet
      - name: Verify health and deployed API version
        run: |
          base_url=$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(status.url)')
          curl --fail --retry 5 --retry-all-errors --max-time 90 "$base_url/health"
          curl --fail --retry 5 --retry-all-errors --max-time 90 "$base_url/openapi.json" -o /tmp/backend-openapi.json
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          expected = tomllib.loads(Path('backend/pyproject.toml').read_text())['project']['version']
          actual = json.loads(Path('/tmp/backend-openapi.json').read_text())['info']['version']
          assert actual == expected, (actual, expected)
          print(f'Verified deployed API {actual}')
          PY
